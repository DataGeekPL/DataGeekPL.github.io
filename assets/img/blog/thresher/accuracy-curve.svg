<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="cvt cvd">
<title id="cvt">Accuracy at every possible cut-off</title>
<desc id="cvd">Test-set accuracy of a gradient-boosted model trained with balanced class weights on the Bank marketing data, for every threshold from 0 to 1. At 0.5 it is 86.1%, below the 88.3% of always answering no. At the 0.85 threshold Thresher picked on validation data it is 91.0%.</desc>
