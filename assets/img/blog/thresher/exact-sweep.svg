<text x="480.0" y="50.0" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle">How the exact sweep finds the best cut-off</text>
<text x="480.0" y="82.0" font-size="19" font-weight="bold" fill="#0096cc" text-anchor="middle">correct(cut) = negatives left of the cut + positives right of it</text>
