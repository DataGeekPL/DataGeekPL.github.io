<text x="900.0" y="498.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">1</text>
<text x="505.0" y="526.0" font-size="17" font-weight="normal" fill="#3A4145" text-anchor="middle">threshold</text>
<line x1="110" y1="470" x2="900" y2="470" stroke="#8a96a0" stroke-width="2"/>
<line x1="110" y1="162.6" x2="900" y2="162.6" stroke="#2c3e50" stroke-width="2" stroke-dasharray="8 7"/>
<text x="118.0" y="152.6" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="start">always answer “no”: 88.3%</text>
