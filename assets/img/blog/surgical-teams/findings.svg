<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t2 d2">
<title id="t2">What moves the needle on issue closure?</title>
<desc id="d2">Three findings. Bigger teams: lower issue closure rate. More centralized work: higher issue closure rate. A stronger developer social network: more commits, but no significant effect on issue closure.</desc>
