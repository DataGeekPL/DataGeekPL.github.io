<text x="98.0" y="221.5" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="end">80%</text>
<line x1="110" y1="151.8" x2="900" y2="151.8" stroke="#E7EEF2" stroke-width="2"/>
<text x="98.0" y="157.8" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="end">90%</text>
<text x="110.0" y="498.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">0</text>
<text x="307.5" y="498.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">0.25</text>
<text x="505.0" y="498.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">0.5</text>
