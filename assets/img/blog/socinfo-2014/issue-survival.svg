<text x="307.5" y="508.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">100</text>
<text x="505.0" y="508.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">200</text>
