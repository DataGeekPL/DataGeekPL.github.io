<title id="t1">Same 10 people, two ways to organize them</title>
<desc id="d1">Left: a team where everyone works on everything, with all 45 communication paths between 10 people drawn. Right: Brooks's surgical team, where one surgeon does the cutting and nine supporting roles connect only to the surgeon - 9 paths.</desc>
