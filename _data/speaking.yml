- name: "SocInfo'14 conference (Barcelona, Spain)"
  date: "Nov 12, 2014"
  description: |
    [Academic] At SocInfo 2014, the 6th International Conference on Social Informatics, I presented
    our paper "GitHub Projects. Quality Analysis of Open-Source Software", which was nominated for the
    best paper award. It measures the quality of open-source projects by their stars and by how quickly
    their teams close issues, and finds that focused, engaged developers matter more than famous ones.
