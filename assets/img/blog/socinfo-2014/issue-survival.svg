<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="svt svd">
<title id="svt">How long do GitHub issues stay open?</title>
<desc id="svd">Share of issues still open by days since they were reported, for all analysed projects and for one example project. Across all projects 37% of issues were closed within 3 days, but 25% were still open after a year. In the example project about half were never closed.</desc>
<rect width="960" height="600" rx="18" fill="#f5f8fa"/>
<text x="480.0" y="50.0" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle">How long do GitHub issues stay open?</text>
<text x="480.0" y="80.0" font-size="17" font-weight="normal" fill="#6b7780" text-anchor="middle">Kaplan-Meier survival of issues reported in 2013, redrawn from the paper</text>
<line x1="110" y1="480.0" x2="900" y2="480.0" stroke="#E7EEF2" stroke-width="2"/>
<text x="98.0" y="486.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="end">0%</text>
