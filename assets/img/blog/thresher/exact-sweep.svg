<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="swt swd">
<title id="swt">How the exact sweep finds the best cut-off</title>
<desc id="swd">Ten sorted scores, positives and negatives. For every place a cut can go, the number of correct answers is the negatives to its left plus the positives to its right. The best cut, at 0.425, gets 9 of 10 right; a cut at 0.5 gets 8.</desc>
