<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="dbt dbd">
<title id="dbt">0.5 vs. the threshold Thresher picks</title>
<desc id="dbd">Test accuracy at 0.5 and at the threshold Thresher picked on validation data, for three models on two datasets. Plain logistic regression barely moves; the class-balanced models gain several points.</desc>
<rect width="960" height="590" rx="18" fill="#f5f8fa"/>
<text x="480.0" y="50.0" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle">0.5 vs. the threshold Thresher picks</text>
<text x="480.0" y="80.0" font-size="17" font-weight="normal" fill="#6b7780" text-anchor="middle">Test accuracy; the threshold was chosen on a separate validation split</text>
<line x1="400.0" y1="160" x2="400.0" y2="548" stroke="#E7EEF2" stroke-width="2"/>
<text x="400.0" y="574.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">80%</text>
<line x1="560.0" y1="160" x2="560.0" y2="548" stroke="#E7EEF2" stroke-width="2"/>
<text x="560.0" y="574.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">84%</text>
<line x1="720.0" y1="160" x2="720.0" y2="548" stroke="#E7EEF2" stroke-width="2"/>
<text x="720.0" y="574.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">88%</text>
<line x1="880.0" y1="160" x2="880.0" y2="548" stroke="#E7EEF2" stroke-width="2"/>
<text x="880.0" y="574.0" font-size="16" font-weight="normal" fill="#6b7780" text-anchor="middle">92%</text>
<text x="40.0" y="176.0" font-size="17" font-weight="bold" fill="#2c3e50" text-anchor="start">Adult income (23.9% positive)</text>
<text x="60.0" y="210.0" font-size="17" font-weight="normal" fill="#3A4145" text-anchor="start">logistic regression</text>
<text x="384.0" y="210.0" font-size="15" font-weight="bold" fill="#2a9d8f" text-anchor="end">t = 0.50</text>
<line x1="610.8" y1="204" x2="610.4" y2="204" stroke="#8a96a0" stroke-width="4"/>
<circle cx="610.8" cy="204" r="9" fill="#e4572e"/>
<circle cx="610.4" cy="204" r="9" fill="#2a9d8f"/>
<text x="628.8" y="210.0" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="start">no change</text>
<text x="60.0" y="268.0" font-size="17" font-weight="normal" fill="#3A4145" text-anchor="start">logistic regression, balanced</text>
<text x="384.0" y="268.0" font-size="15" font-weight="bold" fill="#2a9d8f" text-anchor="end">t = 0.75</text>
<line x1="430.2" y1="262" x2="609.2" y2="262" stroke="#8a96a0" stroke-width="4"/>
<circle cx="430.2" cy="262" r="9" fill="#e4572e"/>
<circle cx="609.2" cy="262" r="9" fill="#2a9d8f"/>
<text x="627.2" y="268.0" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="start">+4.5 pts</text>
<text x="60.0" y="326.0" font-size="17" font-weight="normal" fill="#3A4145" text-anchor="start">boosted trees, balanced</text>
<text x="384.0" y="326.0" font-size="15" font-weight="bold" fill="#2a9d8f" text-anchor="end">t = 0.75</text>
<line x1="537.1" y1="320" x2="682.4" y2="320" stroke="#8a96a0" stroke-width="4"/>
<circle cx="537.1" cy="320" r="9" fill="#e4572e"/>
<circle cx="682.4" cy="320" r="9" fill="#2a9d8f"/>
<text x="700.4" y="326.0" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="start">+3.6 pts</text>
<text x="40.0" y="374.0" font-size="17" font-weight="bold" fill="#2c3e50" text-anchor="start">Bank marketing (11.7% positive)</text>
<text x="60.0" y="408.0" font-size="17" font-weight="normal" fill="#3A4145" text-anchor="start">logistic regression</text>
<text x="384.0" y="408.0" font-size="15" font-weight="bold" fill="#2a9d8f" text-anchor="end">t = 0.38</text>
<line x1="816.5" y1="402" x2="826.2" y2="402" stroke="#8a96a0" stroke-width="4"/>
<circle cx="816.5" cy="402" r="9" fill="#e4572e"/>
<circle cx="826.2" cy="402" r="9" fill="#2a9d8f"/>
<text x="844.2" y="408.0" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="start">+0.2 pts</text>
<text x="60.0" y="466.0" font-size="17" font-weight="normal" fill="#3A4145" text-anchor="start">logistic regression, balanced</text>
<text x="384.0" y="466.0" font-size="15" font-weight="bold" fill="#2a9d8f" text-anchor="end">t = 0.87</text>
<line x1="598.4" y1="460" x2="816.9" y2="460" stroke="#8a96a0" stroke-width="4"/>
<circle cx="598.4" cy="460" r="9" fill="#e4572e"/>
<circle cx="816.9" cy="460" r="9" fill="#2a9d8f"/>
<text x="834.9" y="466.0" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="start">+5.5 pts</text>
<text x="60.0" y="524.0" font-size="17" font-weight="normal" fill="#3A4145" text-anchor="start">boosted trees, balanced</text>
<text x="384.0" y="524.0" font-size="15" font-weight="bold" fill="#2a9d8f" text-anchor="end">t = 0.85</text>
<line x1="644.0" y1="518" x2="838.2" y2="518" stroke="#8a96a0" stroke-width="4"/>
<circle cx="644.0" cy="518" r="9" fill="#e4572e"/>
<circle cx="838.2" cy="518" r="9" fill="#2a9d8f"/>
<text x="856.2" y="524.0" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="start">+4.9 pts</text>
<circle cx="330.0" cy="119" r="8" fill="#e4572e"/>
<text x="346.0" y="124.0" font-size="16" font-weight="normal" fill="#3A4145" text-anchor="start">threshold 0.5</text>
<circle cx="490.0" cy="119" r="8" fill="#2a9d8f"/>
<text x="506.0" y="124.0" font-size="16" font-weight="normal" fill="#3A4145" text-anchor="start">Thresher’s threshold</text>
</svg>
