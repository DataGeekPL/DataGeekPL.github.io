- name: "Thresher - THRESHold EvaluatoR for Python, Spark and Ray"
  date: "2020-2026"
  category: "Open source · Python library & CLI · <code>pip install thresher-py</code>"
  description: |
    A classifier gives you probabilities, and turning them into yes/no answers needs a cut-off - which almost
    every pipeline leaves at the default 0.5. Thresher takes your <code>predict_proba</code>-like scores and the
    ground truth, and returns the threshold that classifies the highest fraction of samples correctly.
    Seven search algorithms (from an exact sweep to faster histogram and search-based ones), support for
    pandas, Apache Spark and Ray, usable as a library or straight from the terminal.
    Documentation: <a href="https://thresher.readthedocs.io/en/stable/" target="_blank">thresher.readthedocs.io</a>.
  url: "https://github.com/oskar-j/thresher"
  image: "github.jpg"
- name: "FastCat - fast lookups of Wikipedia categories"
  date: "2017-2026"
  category: "Open source · Python & Redis · <code>pip install fastcat</code>"
  description: |
    A Python library for quickly looking up broader/narrower relations between Wikipedia categories locally,
    from DBpedia SKOS dumps loaded into Redis - without hammering the Wikipedia API. Started as a fork of
    Ed Summers' original tool; I ported it to Python 3, added support for 7+ Wikipedia languages, made loading
    ~20x faster with pipelined Redis writes and added a new Databus engine. Co-maintained on PyPI.
  url: "https://github.com/oskar-j/fastcat"
  image: "fast_cat.png"
- name: "Walsh-Hadamard transform image codec"
  date: "2019-2026"
  category: "Open source · Python & NumPy"
  description: |
    A complete image codec built on the Walsh-Hadamard transform - a transform from the 1920s that needs nothing
    but additions and subtractions. Pure Python and NumPy, every step exact (the same picture compresses to the
    same bytes on every machine), seven image file formats in and out, DCT and Haar transforms on board to compare
    against, and more than seven hundred tests. Works as a CLI and as a library.
  url: "https://github.com/oskar-j/walsh-hadamard-transform"
  image: "github.jpg"
